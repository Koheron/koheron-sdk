<template class="template">
  <span class="oscillator-label">Local oscillators</span>
  <div class="oscillator-grid">
    <div class="oscillator-field"><label for="lo-0">DUT X</label><span class="pna-digit-control"><input id="lo-0" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="0" min="0" step="0.000001" max="100" required class="dds-input dds-input0" title="Nominal analyzer reference frequency in MHz; tracking adds the displayed correction"><select class="lo-unit" aria-label="Frequency unit"><option>Hz</option><option>kHz</option><option selected>MHz</option><option>GHz</option></select></span></div>
    <div class="oscillator-field"><label for="lo-1">REF X</label><span class="pna-digit-control"><input id="lo-1" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="0" min="0" step="0.000001" max="100" required class="dds-input dds-input1" title="Nominal analyzer reference frequency in MHz; tracking adds the displayed correction"><select class="lo-unit" aria-label="Frequency unit"><option>Hz</option><option>kHz</option><option selected>MHz</option><option>GHz</option></select></span></div>
    <div class="oscillator-field"><label for="lo-2">DUT Y</label><span class="pna-digit-control"><input id="lo-2" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="0" min="0" step="0.000001" max="100" required class="dds-input dds-input2" title="Nominal analyzer reference frequency in MHz; tracking adds the displayed correction"><select class="lo-unit" aria-label="Frequency unit"><option>Hz</option><option>kHz</option><option selected>MHz</option><option>GHz</option></select></span></div>
    <div class="oscillator-field"><label for="lo-3">REF Y</label><span class="pna-digit-control"><input id="lo-3" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="0" min="0" step="0.000001" max="100" required class="dds-input dds-input3" title="Nominal analyzer reference frequency in MHz; tracking adds the displayed correction"><select class="lo-unit" aria-label="Frequency unit"><option>Hz</option><option>kHz</option><option selected>MHz</option><option>GHz</option></select></span></div>
  </div>
  <div class="tracking-controls">
    <label class="toggle" title="Track X and Y phase differences slowly; corrections apply to the corresponding DUT local oscillators."><input type="checkbox" class="tracking-enabled-input">Slow tracking</label>
    <span class="tracking-readout"><span class="tracking-state">Off</span><span>BW ≤ <span class="tracking-effective-bandwidth">---</span> Hz</span><span>X <span class="tracking-correction-x">---</span> Hz</span><span>Y <span class="tracking-correction-y">---</span> Hz</span></span>
  </div>
</template>
