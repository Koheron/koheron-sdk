<template class="template">
  <div class="crossed">
    <span>Input Frequencies (MHz)</span>
  </div>
  <table class="full-width">
    <tr>
      <td style="width: 60px">
        DUT X
      </td>
      <td style="width: 120px">
        <input type="number" value="0" min="0" step="0.000001" max="125.0" class="dds-input0">
      </td>
      <td>
        <button class="default-btn dds-set0">Set</button>
      </td>
    </tr>
    <tr>
      <td style="width: 60px">
        REF X
      </td>
      <td style="width: 120px">
        <input type="number" value="0" min="0" step="0.000001" max="125.0" class="dds-input1">
      </td>
      <td>
        <button class="default-btn dds-set1">Set</button>
      </td>
    </tr>
    <tr>
      <td style="width: 60px">
        DUT Y
      </td>
      <td style="width: 120px">
        <input type="number" value="0" min="0" step="0.000001" max="125.0" class="dds-input2">
      </td>
      <td>
        <button class="default-btn dds-set2">Set</button>
      </td>
    </tr>
    <tr>
      <td style="width: 60px">
        REF Y
      </td>
      <td style="width: 120px">
        <input type="number" value="0" min="0" step="0.000001" max="125.0" class="dds-input3">
      </td>
      <td>
        <button class="default-btn dds-set3">Set</button>
      </td>
    </tr>
    <tr>
      <td style="width: 60px">
        Tracking
      </td>
      <td style="width: 120px">
        <label style="margin: 0; font-weight: normal;">
          <input type="checkbox" class="tracking-enabled-input"> Enable
        </label>
      </td>
      <td></td>
    </tr>
    <tr>
      <td colspan="3" style="font-size: 12px; color: #666;">
        BW: <span class="tracking-effective-bandwidth">---</span> Hz,
        X corr: <span class="tracking-correction-x">---</span> Hz,
        Y corr: <span class="tracking-correction-y">---</span> Hz
      </td>
    </tr>
  </table>
</template>
