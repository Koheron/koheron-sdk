<template class="template">
  <div class="generator-controls">
    <div class="control-field"><span class="control-label">ADC 0 range</span><div class="segmented" role="group" aria-label="ADC 0 input range">
      <label><input type="radio" name="input-range-ch0" value="0" class="adc-range" data-command="setInputRange"><span>2 V</span></label>
      <label><input type="radio" name="input-range-ch0" value="1" class="adc-range" data-command="setInputRange"><span>8 V</span></label>
    </div></div>
    <div class="control-field"><span class="control-label">ADC 1 range</span><div class="segmented" role="group" aria-label="ADC 1 input range">
      <label><input type="radio" name="input-range-ch1" value="2" class="adc-range" data-command="setInputRange"><span>2 V</span></label>
      <label><input type="radio" name="input-range-ch1" value="3" class="adc-range" data-command="setInputRange"><span>8 V</span></label>
    </div></div>
    <span id="range-warning" class="board-tag" role="status" hidden>Sum/difference needs matching input ranges.</span>
  </div>
</template>
