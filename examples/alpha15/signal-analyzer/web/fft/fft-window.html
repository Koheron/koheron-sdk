<template class="template">
  <span id="window-label" class="control-label">FFT window</span>
  <div class="fft-window-buttons" role="group" aria-labelledby="window-label">
    <button type="button" class="default-btn fft-window-button" value="0" aria-pressed="false" disabled>Rectangular</button>
    <button type="button" class="default-btn fft-window-button" value="1" aria-pressed="false" disabled>Hann</button>
    <button type="button" class="default-btn fft-window-button" value="2" aria-pressed="false" disabled>Flat Top</button>
    <button type="button" class="default-btn fft-window-button" value="3" aria-pressed="false" disabled>Blackman-Harris</button>
  </div>
  <span id="window-status" class="control-help" role="status"></span>
</template>
