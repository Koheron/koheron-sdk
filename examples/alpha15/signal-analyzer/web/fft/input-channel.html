<template class="template">
 <span class="control-label">Input channel</span>
 <div class="segmented">
 <label class="radio-wrapper"><input type="radio" name="input-channel" value="0" class="fft-input" data-command="setInputChannel" checked><span>ADC 0</span></label>
 <label class="radio-wrapper"><input type="radio" name="input-channel" value="1" class="fft-input" data-command="setInputChannel"><span>ADC 1</span></label>
 <label class="radio-wrapper"><input type="radio" name="input-channel" value="2" class="fft-input" data-command="setInputChannel"><span>0 − 1</span></label>
 <label class="radio-wrapper"><input type="radio" name="input-channel" value="3" class="fft-input" data-command="setInputChannel"><span>0 + 1</span></label>
 </div>
</template>
