<template class="template">
  <div class="control-field" role="group" aria-label="Input"><span class="control-label">Input</span><div class="segmented">
    <label><input type="radio" name="input-channel" value="0" class="fft-input" data-command="setInputChannel" checked><span>ADC 0</span></label>
    <label><input type="radio" name="input-channel" value="1" class="fft-input" data-command="setInputChannel"><span>ADC 1</span></label>
    <label><input type="radio" name="input-channel" value="2" class="fft-input" data-command="setInputChannel"><span>0 − 1</span></label>
    <label><input type="radio" name="input-channel" value="3" class="fft-input" data-command="setInputChannel"><span>0 + 1</span></label>
  </div></div>
</template>
