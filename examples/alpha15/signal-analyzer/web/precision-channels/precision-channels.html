<template class="template">
  <div class="crossed"><span>Precision DACs</span></div>
  <table class="precision-table">
    <thead><tr><th scope="col">Ch.</th><th scope="col">DAC (mV)</th></tr></thead>
    <tbody>
      <tr><th scope="row">0</th>
        <td><span class="precision-digit-control"><input aria-label="Precision DAC 0 in millivolts" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" required value="0" class="precision-dac-input" data-channel="0" data-command="setDac"></span></td>
      </tr>
      <tr><th scope="row">1</th>
        <td><span class="precision-digit-control"><input aria-label="Precision DAC 1 in millivolts" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" required value="0" class="precision-dac-input" data-channel="1" data-command="setDac"></span></td>
      </tr>
      <tr><th scope="row">2</th>
        <td><span class="precision-digit-control"><input aria-label="Precision DAC 2 in millivolts" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" required value="0" class="precision-dac-input" data-channel="2" data-command="setDac"></span></td>
      </tr>
      <tr><th scope="row">3</th>
        <td><span class="precision-digit-control"><input aria-label="Precision DAC 3 in millivolts" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" required value="0" class="precision-dac-input" data-channel="3" data-command="setDac"></span></td>
      </tr>
    </tbody>
  </table>
</template>
