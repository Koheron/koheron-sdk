<template class="template">
  <fieldset class="control-field">
    <legend>
      10 MHz reference
    </legend>
    <div class="segmented">
      <label>
        <input type="radio" name="reference-clock" value="2" class="clkgen-input" data-command="setReferenceClock" data-valuestr="internal" checked>
        <span>
          Internal
        </span>
      </label>
      <label>
        <input type="radio" name="reference-clock" value="0" class="clkgen-input" data-command="setReferenceClock" data-valuestr="external" >
        <span>
          External
        </span>
      </label>
    </div>
  </fieldset>
</template>
