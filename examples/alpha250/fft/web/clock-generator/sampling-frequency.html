<template class="template">
  <fieldset class="control-field">
    <legend>
      Sampling rate
    </legend>
    <div class="segmented">
      <label>
        <input type="radio" name="sampling-frequency" value="0" class="clkgen-input" data-command="setSamplingFrequency" data-valuestr="200" checked>
        <span>
          200 MHz
        </span>
      </label>
      <label>
        <input type="radio" name="sampling-frequency" value="1" class="clkgen-input" data-command="setSamplingFrequency" data-valuestr="250" >
        <span>
          250 MHz
        </span>
      </label>
    </div>
  </fieldset>
</template>
