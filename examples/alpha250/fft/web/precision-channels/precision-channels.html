<template class="template">
  <div class="crossed"><span>Precision I/O</span></div>
  <table class="precision-table">
    <thead><tr><th scope="col">Ch.</th><th scope="col">DAC (mV)</th><th scope="col"><span class="sr-only">DAC adjustment</span></th><th scope="col">ADC (mV)</th></tr></thead>
    <tbody>
      <tr><th scope="row">0</th>
        <td><input aria-label="Precision DAC 0 in millivolts" type="number" required value="0" min="0" step="0.001" max="2500" class="precision-dac-input" data-channel="0" data-command="setDac"></td>
        <td><input aria-label="Precision DAC 0 slider in millivolts" type="range" value="0" min="0" step="0.001" max="2500" class="precision-dac-input" data-channel="0" data-command="setDac"></td>
        <td><span class="precision-adc-span" data-channel="0"></span></td>
      </tr>
      <tr><th scope="row">1</th>
        <td><input aria-label="Precision DAC 1 in millivolts" type="number" required value="0" min="0" step="0.001" max="2500" class="precision-dac-input" data-channel="1" data-command="setDac"></td>
        <td><input aria-label="Precision DAC 1 slider in millivolts" type="range" value="0" min="0" step="0.001" max="2500" class="precision-dac-input" data-channel="1" data-command="setDac"></td>
        <td><span class="precision-adc-span" data-channel="1"></span></td>
      </tr>
      <tr><th scope="row">2</th>
        <td><input aria-label="Precision DAC 2 in millivolts" type="number" required value="0" min="0" step="0.001" max="2500" class="precision-dac-input" data-channel="2" data-command="setDac"></td>
        <td><input aria-label="Precision DAC 2 slider in millivolts" type="range" value="0" min="0" step="0.001" max="2500" class="precision-dac-input" data-channel="2" data-command="setDac"></td>
        <td><span class="precision-adc-span" data-channel="2"></span></td>
      </tr>
      <tr><th scope="row">3</th>
        <td><input aria-label="Precision DAC 3 in millivolts" type="number" required value="0" min="0" step="0.001" max="2500" class="precision-dac-input" data-channel="3" data-command="setDac"></td>
        <td><input aria-label="Precision DAC 3 slider in millivolts" type="range" value="0" min="0" step="0.001" max="2500" class="precision-dac-input" data-channel="3" data-command="setDac"></td>
        <td><span class="precision-adc-span" data-channel="3"></span></td>
      </tr>
    </tbody>
  </table>
</template>
