<template class="template">
  <span class="oscillator-label">Local oscillators</span>
  <div class="oscillator-grid">
    <div class="oscillator-field"><label for="lo-0">LO 0</label><span class="pna-digit-control"><input id="lo-0" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="0" min="0" step="0.000001" max="100" required class="dds-input dds-input0" title="Analyzer reference frequency in MHz"><select class="lo-unit" aria-label="Frequency unit"><option>Hz</option><option>kHz</option><option selected>MHz</option><option>GHz</option></select></span><button type="button" class="dds-set0" aria-label="Set LO 0 frequency">Set</button></div>
    <div class="oscillator-field"><label for="lo-1">LO 1</label><span class="pna-digit-control"><input id="lo-1" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="0" min="0" step="0.000001" max="100" required class="dds-input dds-input1" title="Analyzer reference frequency in MHz"><select class="lo-unit" aria-label="Frequency unit"><option>Hz</option><option>kHz</option><option selected>MHz</option><option>GHz</option></select></span><button type="button" class="dds-set1" aria-label="Set LO 1 frequency">Set</button></div>
  </div>
</template>
