<template class="template">
  <span class="oscillator-label">Local oscillators</span>
  <div class="oscillator-grid">
    <div class="oscillator-field"><label for="lo-0">LO 0</label><span class="pna-digit-control"><input id="lo-0" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="0" min="0" step="0.000001" max="100" required class="dds-input dds-input0" title="Nominal analyzer reference frequency in MHz; tracking adds the displayed correction"><select class="lo-unit" aria-label="Frequency unit"><option>Hz</option><option>kHz</option><option selected>MHz</option><option>GHz</option></select></span><button type="button" class="dds-set0" aria-label="Set LO 0 frequency">Set</button></div>
    <div class="oscillator-field"><label for="lo-1">LO 1</label><span class="pna-digit-control"><input id="lo-1" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="0" min="0" step="0.000001" max="100" required class="dds-input dds-input1" title="Nominal analyzer reference frequency in MHz; tracking adds the displayed correction"><select class="lo-unit" aria-label="Frequency unit"><option>Hz</option><option>kHz</option><option selected>MHz</option><option>GHz</option></select></span><button type="button" class="dds-set1" aria-label="Set LO 1 frequency">Set</button></div>
  </div>
  <div class="tracking-controls">
    <label class="toggle" title="Track the selected ADC carrier slowly. Turning off restores the nominal LO frequencies."><input type="checkbox" class="tracking-enabled-input">Slow tracking</label>
    <span class="tracking-readout"><span class="tracking-state">Off</span> · BW ≤ <span class="tracking-effective-bandwidth">---</span> Hz · LO0 <span class="tracking-correction-0">---</span> Hz · LO1 <span class="tracking-correction-1">---</span> Hz</span>
  </div>
</template>
