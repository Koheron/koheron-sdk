<svg xmlns="http://www.w3.org/2000/svg" width="560" height="650" viewBox="0 0 560 650" role="img" aria-labelledby="title desc">
<title id="title">DPLL signal flow and controller</title><desc id="desc">One of two identical channels. A shared mixer feeds parallel Fast and Accurate estimators. Accurate frequency and phase feed P and PI gains, followed by nested I squared and I cubed stages. Integrators are numbered to match the controls. Fast mode substitutes P and I while retaining the accurate I squared contribution. Monitoring and the precision DAC remain accurate.</desc>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#647681"/></marker></defs>
<style>text{font-family:Arial,sans-serif;text-anchor:middle;fill:#303d46;font-size:12px}.small{font-size:10.5px;fill:#62737e}.strong{font-weight:600}.wire{fill:none;stroke:#647681;stroke-width:1.3;marker-end:url(#a)}.fast{fill:#fff8ec;stroke:#c5a36c}.accurate{fill:#eef8fc;stroke:#78aec5}.neutral{fill:#fafbfc;stroke:#b9c5cd}.gain{fill:white;stroke:#78aec5}.sum{fill:white;stroke:#647681}</style>
<text x="280" y="15" class="small">ONE CHANNEL · REPEATED FOR ADC 0 AND ADC 1</text>
<rect x="179" y="28" width="202" height="46" rx="4" class="neutral"/>
<text x="280.0" y="47.0" class="strong">ADC × DDS</text>
<text x="280.0" y="63.0" class="small">24-bit I/Q mixer</text>
<path class="wire" d="M280 74V91H85V111" />
<path class="wire" d="M280 91H365V111" />
<circle cx="280" cy="91" r="2.3" fill="#647681"/>
<rect x="20" y="111" width="130" height="66" rx="4" class="fast"/>
<text x="85.0" y="132.0" class="strong">Fast estimate</text>
<text x="85.0" y="148.0" class="small">4-sample filter</text>
<text x="85.0" y="164.0" class="small">Calibrated projection</text>
<rect x="205" y="111" width="320" height="66" rx="4" class="accurate"/>
<text x="365.0" y="132.0" class="strong">Accurate estimate</text>
<text x="365.0" y="148.0" class="small">4 × 16-sample filter · 24-bit extraction</text>
<text x="365.0" y="164.0" class="small">Unwrap → Δφ;  ∑₁ → φ</text>
<path class="wire" d="M85 177V242" />

<rect x="190" y="212" width="350" height="298" rx="6" fill="#f9fcfd" stroke="#d5e5ec"/>
<text x="365" y="228" class="small">ACCURATE CONTROLLER</text>
<path class="wire" d="M255 177V248" />
<text x="270" y="199" class="small">Δφ</text>
<path class="wire" d="M475 177V248" />
<text x="490" y="199" class="small">φ</text>
<rect x="225" y="248" width="60" height="32" rx="4" class="gain"/>
<text x="255.0" y="268.0" class="strong">P</text>
<rect x="445" y="248" width="60" height="32" rx="4" class="gain"/>
<text x="475.0" y="268.0" class="strong">PI</text>
<path class="wire" d="M285 264H315V300H355" />
<path class="wire" d="M445 264H415V300H375" />
<circle cx="365" cy="300" r="10" class="sum"/>
<text x="365" y="304" class="">+</text>
<path class="wire" d="M365 310V396" />
<circle cx="365" cy="324" r="2.3" fill="#647681"/>
<path class="wire" d="M365 324H245V342" />
<rect x="215" y="342" width="60" height="30" rx="4" class="accurate"/>
<text x="245.0" y="361.0" class="strong">∑₂</text>
<path class="wire" d="M245 372V390" />
<rect x="215" y="390" width="60" height="32" rx="4" class="gain"/>
<text x="245.0" y="410.0" class="strong">I²</text>
<path class="wire" d="M275 406H355" />
<circle cx="365" cy="406" r="10" class="sum"/>
<text x="365" y="410" class="">+</text>
<path class="wire" d="M365 416V442" />
<rect x="335" y="442" width="60" height="30" rx="4" class="accurate"/>
<text x="365.0" y="461.0" class="strong">∑₃</text>
<rect x="20" y="242" width="130" height="66" rx="4" class="fast"/>
<text x="85.0" y="263.0" class="strong">Fast P + I</text>
<text x="85.0" y="279.0" class="small">Same P / PI gains</text>
<text x="85.0" y="295.0" class="small">Own I state</text>
<path class="wire" d="M85 308V534H90" />
<path class="wire" d="M335 457H300V490H120V534H110" stroke-dasharray="4 3"/>
