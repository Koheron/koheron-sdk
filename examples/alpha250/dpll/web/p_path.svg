<title id="title">Fast P and I, accurate higher integrators and monitoring</title><desc id="desc">A shared wide mixer feeds a short fast filter and an accurate four-stage filter. Fast phase drives P and I; accurate phase drives I squared, I cubed and phase-noise monitoring.</desc>
