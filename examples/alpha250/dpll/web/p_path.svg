<svg class="dpll-schematic" xmlns="http://www.w3.org/2000/svg" width="560" height="800" viewBox="0 0 560 800" role="img" aria-labelledby="dpll-diagram-title dpll-diagram-desc">
<title id="dpll-diagram-title">DPLL channel signal flow</title>
<desc id="dpll-diagram-desc">A shared mixer feeds Fast and Accurate phase detectors. Fast phase feeds P and an integral PI path. Accurate phase increment feeds P and integrator 1 followed by PI. Their sum feeds integrator 3 directly and a higher-order branch through integrator 2, I squared gain and integrator 3. The higher-order correction is added to both RF candidates. Manual selection with continuity offset drives RF DAC routing. Accurate RF correction drives I cubed and integrator 4 for the precision DAC. The dashed reference connection captures Accurate phase for the Fast integral branch on mode entry. The monitor has a separate Accurate phase tap independent of integrator 1. Repeated integrator 3 symbols represent separately tracked contributions under the same enable control. Scaling and register delays are omitted.</desc>
<defs><marker id="dpll-diagram-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#647780"/></marker></defs>
<style>
svg.dpll-schematic text{font:13px Arial,sans-serif;fill:#263b45;text-anchor:middle}
svg.dpll-schematic .small{font-size:11px;fill:#647780}
svg.dpll-schematic .head{font-weight:600;font-size:14px}
svg.dpll-schematic .wire{fill:none;stroke:#647780;stroke-width:1.35;stroke-linejoin:round;marker-end:url(#dpll-diagram-arrow)}
svg.dpll-schematic .line{fill:none;stroke:#647780;stroke-width:1.35;stroke-linejoin:round}
svg.dpll-schematic .capture{fill:none;stroke:#8b9ba3;stroke-width:1.2;stroke-dasharray:3 3;marker-end:url(#dpll-diagram-arrow)}
svg.dpll-schematic .signal{font:italic 13px Georgia,serif;fill:#536c78}
svg.dpll-schematic .block{fill:white;stroke:#a9bac3;stroke-width:1.1}
svg.dpll-schematic .fast{fill:#fff9ed;stroke:#c5a773}
svg.dpll-schematic .accurate{fill:#f3f9fb;stroke:#83b3c4}
svg.dpll-schematic [data-gain],svg.dpll-schematic [data-integrator],svg.dpll-schematic [data-mode]{transition:opacity 180ms ease,stroke 180ms ease}
svg.dpll-schematic[data-live] [data-state="disabled"] text{fill:#6e7c84}
svg.dpll-schematic[data-live] [data-state="disabled"] rect{stroke-dasharray:3 2;fill:#fafafa;stroke:#c5cdd1}
svg.dpll-schematic[data-live] [data-mode]{opacity:.35}
svg.dpll-schematic[data-live] [data-mode][data-selected="true"]{opacity:1;stroke:#147b94;stroke-width:2.8}
@media(prefers-reduced-motion:reduce){svg.dpll-schematic [data-gain],svg.dpll-schematic [data-integrator],svg.dpll-schematic [data-mode]{transition:none}}
svg.dpll-schematic .gain-name{font-size:12px;font-weight:600}
svg.dpll-schematic .gain-db{font-size:11px;font-variant-numeric:tabular-nums}
svg.dpll-schematic [role="button"]{cursor:pointer;outline:none}
svg.dpll-schematic [data-linked="true"] rect,svg.dpll-schematic [role="button"]:focus-visible rect{stroke:#008fbe;stroke-width:2;stroke-dasharray:none;fill:#e5f5fb}
</style>
