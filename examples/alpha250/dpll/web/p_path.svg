<svg xmlns="http://www.w3.org/2000/svg" width="560" height="620" viewBox="0 0 560 620" role="img" aria-labelledby="title desc">
<title id="title">DPLL — one channel</title>
<desc id="desc">A shared ADC and DDS mixer feeds parallel estimators. Fast P and I combine with the accurate higher-order contribution. The Accurate controller contains the P, PI, I squared and I cubed gains and integrators 2, 3 and 4; phase reconstruction uses integrator 1. The manual selector feeds RF DAC routing. The precision DAC and monitor always use Accurate signals. Controller equations show functional structure, omitting fixed-point scaling.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#657984"/></marker></defs>
<style>
text{font-family:Arial,sans-serif;fill:#283c47;text-anchor:middle;font-size:13px}
.title{font-weight:600;font-size:14px}.sub{font-size:11px;fill:#627782}.equation{font-size:14px;font-family:Georgia,serif}.wire{fill:none;stroke:#657984;stroke-width:1.4;marker-end:url(#arrow)}.fast{fill:#fff8ec;stroke:#c3a16c}.accurate{fill:#eff8fc;stroke:#7cacc1}.neutral{fill:#fafbfc;stroke:#bdc9d0}.output{fill:white;stroke:#aabcc6}
</style>
<text class="sub" x="280" y="18">ONE CHANNEL · IDENTICAL FOR ADC 0 AND ADC 1</text>
<rect class="neutral" x="170" y="34" width="220" height="48" rx="5"/>
<text class="title" x="280" y="55">ADC × DDS</text><text class="sub" x="280" y="72">24-bit I/Q mixer</text>
<path class="wire" d="M280 82V101H109V124"/><path class="wire" d="M280 101H384V124"/><circle cx="280" cy="101" r="2.5" fill="#657984"/>

<rect class="fast" x="24" y="124" width="170" height="84" rx="5"/>
<text class="title" x="109" y="147">Fast estimate</text><text x="109" y="170">4-sample filter</text><text class="sub" x="109" y="190">Calibrated local projection</text>
<rect class="accurate" x="240" y="124" width="288" height="84" rx="5"/>
<text class="title" x="384" y="147">Accurate estimate</text><text x="384" y="170">4 × 16 filter · 24-bit extraction</text><text class="sub" x="384" y="190">Unwrap → Δφ;  ∑₁ → φ</text>
<path class="wire" d="M109 208V250M384 208V250"/>

<rect class="fast" x="24" y="250" width="170" height="106" rx="5"/>
<text class="title" x="109" y="275">Fast P + I</text>
<text class="equation" x="109" y="306">P φ<tspan baseline-shift="sub" font-size="10">f</tspan> + PI ∑φ<tspan baseline-shift="sub" font-size="10">f</tspan></text>
<text class="sub" x="109" y="337">Same gains · separate I state</text>
<rect class="accurate" x="240" y="250" width="288" height="130" rx="5"/>
<text class="title" x="384" y="275">Accurate controller</text>
<text class="equation" x="384" y="305">s = P Δφ + PI φ</text>
<text class="equation" x="384" y="333">u<tspan baseline-shift="sub" font-size="10">A</tspan> = ∑₃(s + I² ∑₂s)</text>
<text class="equation" x="384" y="361">v<tspan baseline-shift="sub" font-size="10">A</tspan> = ∑₄(I³ u<tspan baseline-shift="sub" font-size="10">A</tspan>)</text>

<path class="wire" d="M109 356V400"/>
<path class="wire" d="M240 344H220V412H121" stroke-dasharray="4 3"/>
<text class="sub" x="179" y="398">I² contribution</text>
<circle cx="109" cy="412" r="12" fill="white" stroke="#657984" stroke-width="1.4"/><text x="109" y="417" font-size="18">+</text>
<path class="wire" d="M109 424V460H160"/>
<text class="sub" x="125" y="447">Fast</text>
<path class="wire" d="M384 380V460H340"/>
<text class="sub" x="367" y="437">u<tspan baseline-shift="sub" font-size="8">A</tspan></text>
<rect class="neutral" x="160" y="438" width="180" height="48" rx="5"/>
<text class="title" x="250" y="459">P + I mode</text><text class="sub" x="250" y="476">Manual · continuous handoff</text>

<path class="wire" d="M250 486V526H109V556"/>
<path class="wire" d="M496 380V514H293V556"/>
<text class="sub" x="484" y="410">v<tspan baseline-shift="sub" font-size="8">A</tspan></text>
<path class="wire" d="M528 166H549V578H538"/>
<rect class="output" x="24" y="556" width="170" height="44" rx="5"/><text class="title" x="109" y="582">RF DAC routing</text>
<rect class="output" x="218" y="556" width="150" height="44" rx="5"/><text class="title" x="293" y="582">Precision DAC</text>
<rect class="output" x="388" y="556" width="150" height="44" rx="5"/><text class="title" x="463" y="575">Monitor</text><text class="sub" x="463" y="591">CIC · FIR · DMA</text>
<text class="sub" x="280" y="617">∑₁…∑₄: integrators 1–4 · fixed-point scaling omitted</text>
</svg>
