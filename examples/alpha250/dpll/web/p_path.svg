<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" role="img" aria-labelledby="title desc">
  <title id="title">DPLL signal flow, one channel</title>
  <desc id="desc">The ADC and DDS feed a shared I/Q mixer. Parallel Fast and Accurate estimators run continuously. The Accurate controller supplies its complete RF correction, the I squared contribution for Fast mode, and the precision DAC. A manual selector chooses Accurate correction or Fast P plus I with accurate I squared. Monitoring always uses the accurate phase.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#697985"/></marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #303c45; text-anchor: middle; }
    .label { font-size: 13px; font-weight: 600; }
    .detail { font-size: 11px; fill: #64727d; }
    .wire { fill: none; stroke: #697985; stroke-width: 1.4; marker-end: url(#arrow); }
    .branch { fill: none; stroke: #697985; stroke-width: 1.4; }
    .neutral { fill: #fafbfc; stroke: #bbc5cc; }
    .fast { fill: #fff9ef; stroke: #c5a36c; }
    .accurate { fill: #eff8fc; stroke: #78aec5; }
    .port { fill: white; stroke: #bbc5cc; }
  </style>
  <text class="detail" x="280" y="14">ONE CHANNEL · TWO PARALLEL ESTIMATES</text>
  <rect class="neutral" x="177" y="28" width="206" height="48" rx="5"/>
  <text class="label" x="280" y="48">ADC × DDS</text>
  <text class="detail" x="280" y="65">24-bit I/Q mixer</text>
  <path class="branch" d="M280 76V90H140M280 90H410"/>
  <circle cx="280" cy="90" r="2.5" fill="#697985"/>
  <path class="wire" d="M140 90V112M410 90V112"/>

  <rect class="fast" x="40" y="112" width="200" height="66" rx="5"/>
  <text class="label" x="140" y="132">Fast estimate</text>
  <text class="detail" x="140" y="151">4-sample filter · local projection</text>
  <text class="detail" x="140" y="167">Calibrated near lock</text>
  <rect class="accurate" x="310" y="112" width="200" height="66" rx="5"/>
  <text class="label" x="410" y="132">Accurate estimate</text>
  <text class="detail" x="410" y="151">4 × 16-sample filter</text>
  <text class="detail" x="410" y="167">24-bit phase extraction + unwrap</text>
  <path class="wire" d="M120 178V218M400 178V218"/>

  <rect class="fast" x="40" y="218" width="152" height="48" rx="5"/>
  <text class="label" x="116" y="247">P + I</text>
  <rect class="accurate" x="286" y="218" width="224" height="48" rx="5"/>
  <text class="label" x="398" y="238">Accurate controller</text>
  <text class="detail" x="398" y="256">P · I · I² · I³</text>
  <path class="wire" d="M192 242H217M286 242H241"/>
  <text class="detail" x="263" y="232">I²</text>
  <circle cx="229" cy="242" r="11" fill="white" stroke="#697985" stroke-width="1.4"/>
  <text x="229" y="247" font-size="17">+</text>
  <path class="wire" d="M229 253V294M355 266V318H314"/>
  <text class="detail" x="260" y="285">Fast</text>
  <text class="detail" x="325" y="285">Accurate</text>

  <rect class="neutral" x="114" y="294" width="200" height="48" rx="5"/>
  <text class="label" x="214" y="314">P + I mode</text>
  <text class="detail" x="214" y="332">Manual selection · continuous handoff</text>
  <path class="wire" d="M214 342V376"/>
  <rect class="port" x="114" y="376" width="200" height="40" rx="5"/>
  <text class="label" x="214" y="401">RF DAC routing</text>

  <path class="wire" d="M510 148H545V314H530"/>
  <rect class="port" x="418" y="294" width="112" height="48" rx="5"/>
  <text class="label" x="474" y="314">Monitor</text>
  <text class="detail" x="474" y="332">CIC · FIR · DMA</text>
  <path class="wire" d="M398 266V396H418"/>
  <text class="detail" x="383" y="366">I³</text>
  <rect class="port" x="418" y="376" width="112" height="40" rx="5"/>
  <text class="label" x="474" y="393">Precision</text>
  <text class="detail" x="474" y="407">DAC</text>
  <text class="detail" x="280" y="437">I², I³ and monitoring always use the Accurate path.</text>
</svg>
