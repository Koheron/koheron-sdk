<svg xmlns="http://www.w3.org/2000/svg" width="560" height="676" viewBox="0 0 560 676" role="img" aria-labelledby="title desc">
  <title id="title">DPLL signal flow for one channel</title>
  <desc id="desc">ADC and reference DDS feed a shared I/Q mixer. Parallel Fast and Accurate estimators feed their controllers. Fast P and I combine with the Accurate I squared contribution before manual mode selection. The selected correction feeds RF DAC routing. The Accurate correction also feeds I cubed and integrator 4 to the precision DAC. The monitor taps the Accurate estimator independently. Integrators 1 through 4 correspond to the web controls. Controller stages are shown functionally; arithmetic scaling and pipeline registers are omitted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#647780"/></marker>
    <marker id="blue-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#1882a4"/></marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; font-size: 13px; fill: #33434b; text-anchor: middle; }
    .heading { font-size: 14px; font-weight: 600; }
    .small { font-size: 11px; fill: #647780; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: .8px; }
    .wire { fill: none; stroke: #647780; stroke-width: 1.5; stroke-linejoin: round; marker-end: url(#arrow); }
    .accurate-wire { fill: none; stroke: #1882a4; stroke-width: 1.5; stroke-linejoin: round; marker-end: url(#blue-arrow); }
    .box { fill: #fff; stroke: #ced7dc; }
    .fast-box { fill: #fffaf0; stroke: #d8bd83; }
    .accurate-box { fill: #f2f9fc; stroke: #91c2d2; }
  </style>

  <text class="small" x="280" y="17">One channel · repeated for ADC 0 and ADC 1 · 250 MS/s</text>
  <rect class="box" x="94" y="32" width="128" height="28" rx="4"/>
  <text x="158" y="51">ADC input</text>
  <rect class="box" x="338" y="32" width="128" height="28" rx="4"/>
  <text x="402" y="51">Reference DDS</text>
  <path class="wire" d="M158 60V83H202"/>
  <path class="wire" d="M402 60V83H358"/>
  <rect class="box" x="202" y="67" width="156" height="32" rx="4"/>
  <text class="heading" x="280" y="88">24-bit I/Q mixer</text>
  <path class="wire" d="M280 99V112H126V144"/>
  <path class="wire" d="M280 112H414V144"/>
  <circle cx="280" cy="112" r="2.5" fill="#647780"/>

  <rect class="fast-box" x="16" y="144" width="220" height="82" rx="5"/>
  <text class="heading" x="126" y="168">Fast · near lock</text>
  <text x="126" y="189">4-sample filter · local projection</text>
  <text class="small" x="126" y="211">Calibrate phase and amplitude after lock</text>
  <rect class="accurate-box" x="284" y="144" width="260" height="82" rx="5"/>
  <text class="heading" x="414" y="168">Accurate · full range</text>
  <text x="414" y="189">4 × 16 filter · 24-bit extraction</text>
  <text class="small" x="414" y="211">Unwrap · phase reconstruction (integrator 1)</text>
  <path class="wire" d="M126 226V258"/>
  <path class="accurate-wire" d="M414 226V258"/>

  <rect class="fast-box" x="16" y="258" width="220" height="110" rx="5"/>
  <text class="heading" x="126" y="283">P + I controller</text>
  <text x="126" y="309">P × local phase</text>
  <text x="126" y="331">PI × accumulated phase error</text>
  <text class="small" x="126" y="354">Shared gains · separate I state</text>
  <rect class="accurate-box" x="284" y="258" width="260" height="110" rx="5"/>
  <text class="heading" x="414" y="283">P + I + I² controller</text>
  <text x="414" y="307">P / PI gains · nested I² branch</text>
  <text x="414" y="330">Integrators 2 and 3 → RF correction</text>
  <text class="small" x="414" y="357">Accurate states run in both modes</text>

  <path class="wire" d="M126 368V400"/>
  <path class="accurate-wire" d="M284 344H260V412H138"/>
  <text class="small" x="202" y="400" style="fill:#1882a4">I² contribution</text>
  <circle cx="126" cy="412" r="12" fill="#fff" stroke="#647780" stroke-width="1.5"/>
  <path d="M121 412H131M126 407V417" stroke="#647780" stroke-width="1.5"/>
  <path class="wire" d="M126 424V466H180"/>
  <text class="small" x="148" y="456">Fast</text>
  <path class="accurate-wire" d="M414 368V466H380"/>
  <text class="small" x="437" y="447" style="fill:#1882a4">Accurate</text>
  <rect class="box" x="180" y="442" width="200" height="50" rx="5"/>
  <text class="heading" x="280" y="462">P + I mode selector</text>
  <text class="small" x="280" y="481">Manual · continuous handoff</text>

  <path class="wire" d="M280 492V508H126V526"/>
  <path class="accurate-wire" d="M414 389H506V508H414V526"/>
  <circle cx="414" cy="389" r="2.5" fill="#1882a4"/>
  <rect class="box" x="16" y="526" width="220" height="52" rx="5"/>
  <text class="heading" x="126" y="548">RF DAC routing</text>
  <text class="small" x="126" y="566">Selected loop correction</text>
  <rect class="accurate-box" x="284" y="526" width="260" height="52" rx="5"/>
  <text class="heading" x="414" y="548">Precision DAC</text>
  <text class="small" x="414" y="566">Accurate correction → I³ gain → integrator 4</text>

  <path class="accurate-wire" d="M544 201H552V624H544"/>
  <rect class="accurate-box" x="284" y="598" width="260" height="52" rx="5"/>
  <text class="heading" x="414" y="620">Phase-noise monitor</text>
  <text class="small" x="414" y="639">Accurate phase → CIC · FIR · DMA</text>
  <text class="small" x="126" y="617">Numbers match the integrator controls</text>
  <text class="small" x="126" y="635">Fast requires 1 and 3 enabled</text>
  <text class="small" x="280" y="672">Both paths run continuously · mode selection changes the RF correction</text>
</svg>
