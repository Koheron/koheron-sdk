<text x="245.0" y="556.0" class="strong">P + I mode</text>
<text x="245.0" y="572.0" class="small">Manual, continuous handoff</text>
<path class="wire" d="M245 582V610" />
<rect x="170" y="610" width="150" height="30" rx="4" class="neutral"/>
<text x="245.0" y="629.0" class="strong">RF DAC routing</text>
<path class="wire" d="M507 503V519H398V597H428V610" />
<rect x="358" y="610" width="140" height="30" rx="4" class="neutral"/>
<text x="428.0" y="629.0" class="strong">Precision DAC</text>
<path class="wire" d="M525 144H550V558H524" />
<rect x="410" y="538" width="114" height="44" rx="4" class="neutral"/>
<text x="467.0" y="556.0" class="strong">Monitor</text>
<text x="467.0" y="572.0" class="small">CIC · FIR · DMA</text>
