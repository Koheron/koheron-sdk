<rect class="box" x="235" y="35" width="180" height="65" rx="6"/><text x="250" y="62">4-sample filter</text><text x="250" y="87">Local projection</text>
<rect class="box" x="465" y="35" width="160" height="65" rx="6"/><text x="485" y="62">Fast P + I</text><text x="477" y="87">Accurate reference</text>
<rect class="box" x="235" y="195" width="195" height="85" rx="6"/><text x="250" y="223">4 × 16-sample filter</text><text x="250" y="248">24-bit CORDIC</text><text x="250" y="272">Accurate unwrap</text>
<rect class="box" x="470" y="195" width="160" height="60" rx="6"/><text x="485" y="222">Accurate I² / I³</text><text x="485" y="245">Independent states</text>
<rect class="box" x="690" y="100" width="190" height="70" rx="6"/><text x="705" y="129">Manual selector</text><text x="705" y="154">RF DACs</text>
<text x="480" y="285">I³ → precision DACs</text>
<rect class="box" x="690" y="240" width="190" height="65" rx="6"/><text x="705" y="268">Monitor selector</text><text x="705" y="293">CIC → FIR → DMA</text>
