memory:
  - name: control
    offset: 0x4000_0000
    range: 4K
    registers:
    - led
    - phase_incr[4]
    - cordic
    - cic_rate
    - phase_precision
  - name: status
    offset: 0x5000_0000
    range: 4K
    registers:
    - adc[n_adc]
    - demod[n_adc]
    - phase_packet
  - name: xadc
    offset: 0x43C0_0000
    range: 64K
  - name: awg
    offset: 0x4400_0000
    range: 8K
  - name: ram
    offset: 0x1E00_0000
    range: 32M
    compatible: "koheron,mem-wc-1.0"
    dev: /dev/mem_wc
  - name: dma
    offset: 0x8000_0000
    range: 64K
  - name: axi_hp0
    offset: 0xF800_8000
    range: 4K

parameters:
  fclk0: 125000000
  fclk1: 125000000
  adc_clk: 125000000
  dac_width: 14
  adc_width: 14
  dds_output_width: 16
  phase_filter_width: 40
  n_adc: 2
  cic_differential_delay: 1
  cic_decimation_rate_default: 20
  cic_decimation_rate_min: 4
  cic_decimation_rate_max: 8192
  cic_n_stages: 6
  n_pts: 131072
  cordic_phase_width: 24
  phase_accumulator_width: 32
