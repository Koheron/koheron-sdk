memory:
  - name: control
    offset: 0x40000000
    range: 4K
    dev: /dev/uio
    registers: [led, mode, capture, samples, snapshot, reset_diag, scratch, stalls, fault, packet_bytes, decimation, irq_period, irq_ack]
  - name: status
    offset: 0x50000000
    range: 4K
    dev: /dev/uio
    protection: read
    registers: [identity, scratch_echo, "cycles[2]", "tx_words[2]", "rx_words[2]", overflow, packets, discontinuities, capture_done, snapshot_id, "dna[2]", checker_errors, keep_errors, input_stalls, output_stalls, irq_count, irq_pending]
  - name: bram
    offset: 0x42000000
    range: 16K
    dev: /dev/mem_wc
  - name: dma
    offset: 0x40400000
    range: 64K
    dev: /dev/uio
  - name: uart_a
    offset: 0x40600000
    range: 4K
    dev: /dev/uio
  - name: uart_b
    offset: 0x40610000
    range: 4K
    dev: /dev/uio
  - name: xadc
    offset: 0x43C00000
    range: 64K
    dev: /dev/uio
  - name: buffers
    offset: 0x18000000
    range: 8M
    compatible: koheron,mem-wc-1.0
    dev: /dev/mem_wc
parameters:
  fclk0: 125000000
  adc_clk: 125000000
  uart_fifo_bytes: 64
