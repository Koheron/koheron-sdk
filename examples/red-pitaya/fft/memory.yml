memory:
  - name: control
    offset: 0x4000_0000
    range: 4K
    registers:
    - led
    - mmcm # Reserved to preserve FFT register offsets.
    - ctl_fft
    - psd_valid
    - psd_input_sel
    - phase_incr[2]
  - name: status
    offset: 0x5000_0000
    range: 4K
    registers:
    - adc[n_adc]
    - cycle_index
  - name: xadc
    offset: 0x43C0_0000
    range: 64K
  # Window coefficient BRAM used by the shared FFT core.
  - name: demod
    offset: 0x6000_0000
    range: 8K
  - name: psd
    offset: 0x7000_0000
    range: 8K

parameters:
  fclk0: 143000000 # 1 GHz I/O PLL / 7 generates 142.857 MHz.
  adc_clk: 125000000
  dac_width: 14
  adc_width: 14
  n_adc: 2
  fft_size: 2048
  n_cycles: 1023
