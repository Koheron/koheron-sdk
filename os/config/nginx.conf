# Most supported Zynq boards have two CPU cores. Keep the HTTP worker footprint
# bounded even on larger boards; the instrument server does the acquisition work.
user                     www-data;
worker_processes         2;
pid                      /run/nginx.pid;
error_log                stderr;

events {
    worker_connections   768;
}

http {
    ##
    # Basic Settings
    ##

    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    # http://stackoverflow.com/questions/27196776/uwsgi-upstart-on-amazon-linux
    client_max_body_size 20M;
    keepalive_timeout    30;
    # RuntimeDirectory=nginx provides this parent on every boot. Buffer uploads
    # in volatile storage rather than writing them to the SD card.
    client_body_temp_path /run/nginx/client-body;
    uwsgi_temp_path       /run/nginx/uwsgi;

    types_hash_max_size  2048;

    default_type         application/octet-stream;

    ##
    # Logging Settings
    ##

    access_log           off;
    error_log            stderr;

    ##
    # Gzip Settings
    ##

    gzip                 on;
    gzip_comp_level      1;
    gzip_min_length      1024;
    gzip_vary            on;
    # Keep compression limited to HTML (nginx's default). Compressing JS/CSS
    # per request costs more CPU than it saves on a fast board LAN.

    # Upgrade WebSockets while allowing ordinary HTTP connections to close.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ##
    # Virtual Host Configs
    ##

    include             /etc/nginx/mime.types;
    include             /etc/nginx/conf.d/*.conf;
    include             /etc/nginx/sites-enabled/*;
}
