<!DOCTYPE html>
<html lang="en">
<head>
  <title>Instrument details · Koheron</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/koheron/kbird.ico">
  <link rel="stylesheet" href="/koheron/main.css">
  <link rel="stylesheet" href="/koheron/instrument.css">
  <link rel="stylesheet" href="/koheron/system.css">
</head>
<body class="instrument-workspace system-workspace">
  <header class="app-header">
    <a class="brand" href="/koheron/" aria-label="Koheron system"><img src="/koheron/koheron_logo.svg" alt="Koheron"></a>
    <h1>System</h1>
    <nav aria-label="Board navigation"><a href="/koheron/" aria-current="page">Instruments</a><a href="/koheron/logs_rate.html">Data rates</a><a href="/">Instrument ↗</a></nav>
  </header>
  <main class="system-main">
    <a href="/koheron/">← Installed instruments</a>
    <div class="summary-heading"><h2 id="instrument-name">Instrument details</h2><span class="muted">Version <span id="instrument-version">—</span></span></div>
    <section class="preflight-panel" aria-labelledby="instrument-check-heading">
      <div class="section-heading"><h2 id="instrument-check-heading">Compatibility and storage</h2><button id="instrument-check-refresh" type="button">Check again</button></div>
      <div id="instrument-check" role="status">Checking instrument…</div>
    </section>
    <section aria-labelledby="commands-heading">
      <h2 id="commands-heading">Available commands</h2>
      <p id="instrument-commands-status" class="status-line" role="status">Loading…</p>
      <div id="instrument-commands" class="instrument-disclosures"></div>
    </section>
  </main>
  <script src="/koheron/instruments.js"></script>
  <script>new InstrumentSummaryWidget(document);</script>
</body>
</html>
