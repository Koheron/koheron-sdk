<template class="template">
  <div class="dds-pm-widget dds-frequency-widget">
    <div class="pm-toolbar"><strong>DDS frequency</strong><span id="dds-frequency-status" role="status">Connecting…</span></div>
    <fieldset id="dds-frequency-controls" disabled>
      <div class="pm-channel pm-field">
        <label for="dds-frequency-0">OUT 0</label>
        <div class="pm-frequency-control">
          <input id="dds-frequency-0" type="text" inputmode="decimal" class="pm-frequency-number dds-channel-input" data-channel="0" aria-label="OUT 0 frequency">
          <select class="dds-frequency-unit" data-channel="0" aria-label="OUT 0 frequency unit"><option>Hz</option><option>kHz</option><option selected>MHz</option></select>
        </div>
      </div>
      <div class="pm-channel pm-field">
        <label for="dds-frequency-1">OUT 1</label>
        <div class="pm-frequency-control">
          <input id="dds-frequency-1" type="text" inputmode="decimal" class="pm-frequency-number dds-channel-input" data-channel="1" aria-label="OUT 1 frequency">
          <select class="dds-frequency-unit" data-channel="1" aria-label="OUT 1 frequency unit"><option>Hz</option><option>kHz</option><option selected>MHz</option></select>
        </div>
      </div>
    </fieldset>
  </div>
</template>
