name: Host checks

on:
  pull_request:
  push:
    branches: [V1, master]

permissions:
  contents: read

concurrency:
  group: configuration-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Validate configurations and host regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl
          python3 -m pip install --disable-pip-version-check -r requirements.txt ./python
      - name: Run fast host profile
        run: make check CHECK_PROFILE=fast HOST_PYTHON=python3
      - name: Check C++ client ownership and protocol
        run: CXX=g++ python3 -m unittest discover -s server/tests -p test_cpp_client.py -v
