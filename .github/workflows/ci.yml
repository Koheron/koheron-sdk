name: Red Pitaya preset

on:
  pull_request:
  push:
    branches: [V1, master]

permissions:
  contents: read

concurrency:
  group: red-pitaya-preset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red-pitaya-preset:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check MIO electrical settings
        run: tclsh boards/red-pitaya/tests/check_mio.tcl
