name: SDK checks

on:
  pull_request:
  push:
    branches: [V1, master]

permissions:
  contents: read

concurrency:
  group: configuration-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configurations:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Test instrument copying
        run: python3 -m unittest discover -s python/tests -p test_copy_instrument.py
      - name: Test image toolchain manifest
        run: python3 -m unittest discover -s os/tests -p test_toolchain_manifest.py
      - name: Test kernel and device-tree compiler dependencies
        run: python3 -m unittest discover -s os/tests -p test_linux_make.py
      - name: Validate instrument configurations
        run: |
          count=0
          while IFS= read -r config; do
            if ! python3 python/koheron/validate_config.py --cfg "$config" --no-color > /tmp/validate.log 2>&1; then
              cat /tmp/validate.log
              exit 1
            fi
            count=$((count + 1))
          done < <(find examples -name config.mk | sort)
          test "$count" -gt 0
          echo "Validated $count instrument configurations"

  server-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CXX: g++-13
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install server test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++-13 libeigen3-dev
      - name: Test server dispatch and clients
        run: python3 -m unittest discover -s server/tests -v
      - name: Check server networking with sanitizers
        env:
          CXXFLAGS: -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -g -no-pie
        run: |
          python3 -m unittest discover -s server/tests -p test_driver_locking.py -v
          python3 -m unittest discover -s server/tests -p 'test_websocket*.py' -v

  instrument-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CXX: g++-13
      PNA_TEST_MODE: native
      PNA_PYTHON: python3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++-13 libeigen3-dev
          python3 -m pip install -r python/requirements.txt numpy scipy
          npm ci --prefix web
      - name: Compile instrument web assets
        run: |
          for project in alpha250/phase-noise-analyzer alpha250-4/phase-noise-analyzer red-pitaya/phase-noise-analyzer alpha250/dpll; do
            make CFG="examples/$project/config.mk" WEB_DOWNLOADS_MK=/dev/null \
              TSC='web/node_modules/.bin/tsc --target ES5 --lib es6,dom --alwaysStrict --skipLibCheck --module system --incremental --typeRoots web/node_modules/@types' web
          done
      - name: Check PNA processing, acquisition, clients and DPLL controls
        run: bash server/drivers/phase-noise/tests/run-host.sh
