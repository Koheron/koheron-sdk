name: SDK checks

on:
  pull_request:
  push:
    branches: [V1, master]

permissions:
  contents: read

concurrency:
  group: sdk-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configurations:
    name: Quick smoke tests
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install smoke-test dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML Jinja2 CppHeaderParser==2.7.4 numpy requests Click 'websocket-client>=1.8,<2'
      - name: Check SDK host workflows and example configurations
        run: make check HOST_PYTHON=python3 FORMAT=json
      - name: Test image toolchain manifest
        run: python3 -m unittest discover -s os/tests -p test_toolchain_manifest.py
      - name: Test kernel and device-tree compiler dependencies
        run: python3 -m unittest discover -s os/tests -p test_linux_make.py
      - name: Check downloaded asset permissions
        run: python3 -m unittest discover -s os/tests -p test_download_verified.py
      - name: Check C++ logging
        run: python3 -m unittest discover -s server/tests -p test_syslog.py
  build-dependencies:
    name: Cached build dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install generator test dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML Jinja2 CppHeaderParser==2.7.4
      - name: Check management compiler and linker settings
        run: python3 -m unittest discover -s os/tests -p test_api_make.py
      - name: Check unchanged image caching
        run: python3 -m unittest discover -s os/tests -p test_image_metadata_make.py
      - name: Check image build job limits
        run: python3 -m unittest discover -s os/tests -p test_build_script.py
      - name: Check cached kernel selection
        run: python3 -m unittest discover -s os/tests -p test_linux_selection_make.py
      - name: Check cached bootloader selection
        run: python3 -m unittest discover -s os/tests -p test_uboot_make.py
      - name: Check flashing uses the existing image
        run: python3 -m unittest discover -s os/tests -p test_flash_make.py
      - name: Check FPGA tool, mode, timing and source dependencies
        run: python3 -m unittest discover -s fpga/tests/build_flow
  management:
    name: Native C++23 management runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test in Ubuntu 26.04 with GCC 15
        run: |
          docker build -f os/api/tests/Dockerfile -t koheron-management-tests .
          docker run --rm -v "$PWD:/work" -w /work koheron-management-tests
  management-ui:
    name: Management UI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check TypeScript and browser behavior
        run: |
          docker build -f web/Dockerfile.web -t koheron-web web
          docker run --rm -v "$PWD:/work" -w /work koheron-web sh -ec '
            node --test os/www/tests/test_*.cjs
            node /opt/app/build.cjs --output /tmp/koheron-manager.js web/koheron.ts web/instrument/poller.ts os/www/*.ts
          '
